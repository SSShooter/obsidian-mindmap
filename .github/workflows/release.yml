# Manually triggered release pipeline:
# sync manifest/versions -> build -> create tag + GitHub release (with changelog section + plugin assets)
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install

      - name: Read version and check tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Obsidian convention: tag exactly matches manifest version, no leading "v"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          echo "Releasing $VERSION"

      - name: Sync manifest.json and versions.json
        id: sync
        run: |
          pnpm run version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
          else
            git commit -m "chore: bump plugin version to ${{ steps.version.outputs.version }}"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Supports both "## 4.0.0" and "## [4.0.0] - date" headings
          awk -v ver="$VERSION" '
            /^## / {
              h = $0; gsub(/[\[\]]/, "", h)
              if (index(h, "## " ver " ") == 1 || h == "## " ver) { found = 1; next }
              else if (found) exit
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::No changelog section found for $VERSION in CHANGELOG.md"
            exit 1
          fi
          echo "--- release notes ---"
          cat release_notes.md

      - name: Build plugin
        run: pnpm run build

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$VERSION" \
            --target "${{ steps.sync.outputs.sha }}" \
            --title "$VERSION" \
            --notes-file release_notes.md \
            manifest.json main.js styles.css
